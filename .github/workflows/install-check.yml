name: 安裝指令檢查

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Run the one-line installer (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:TIETIE_NO_OPEN = '1'
          irm https://raw.githubusercontent.com/KLWSharpe/tietie/main/install.ps1 | iex
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Tietie\Tietie.exe'
          if (-not (Test-Path $exe)) { Write-Host 'NOT INSTALLED'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'v.txt'
          Start-Process $exe -ArgumentList '--version' -Wait -RedirectStandardOutput $out
          Get-Content $out
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter '*Tietie.lnk' | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Start menu shortcut: $lnk"
          if (-not $lnk) { exit 1 }
          $env:TIETIE_HOME = Join-Path $env:RUNNER_TEMP 'tt'
          $p = Start-Process $exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content (Join-Path $env:TIETIE_HOME 'selftest.txt') -Encoding UTF8 | Select-Object -Last 1
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 從貼貼裡按「立即更新」（實際下載安裝）
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Tietie\Tietie.exe'
          $env:TIETIE_HOME = Join-Path $env:RUNNER_TEMP 'tt-upd'
          '{"tag_name":"v9.9.9"}' | Set-Content "$env:RUNNER_TEMP\fake-release.json" -Encoding UTF8
          $env:TIETIE_UPDATE_URL = ([Uri]"$env:RUNNER_TEMP\fake-release.json").AbsoluteUri
          $before = (Get-Item $exe).LastWriteTimeUtc
          # 實驗 A：用跟貼貼一樣的方式跑安裝指令（繼承這個 PowerShell 7 的環境），把輸出記下來
          $env:TIETIE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'probe-install'
          $env:TIETIE_NO_OPEN = '1'
          $cmd = 'irm https://raw.githubusercontent.com/KLWSharpe/tietie/main/install.ps1 | iex'
          $probe = Start-Process powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $cmd -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\probe-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\probe-err.txt"
          Write-Host "實驗 A（繼承 PowerShell 7 環境）結束碼：$($probe.ExitCode)　裝好了嗎：$(Test-Path (Join-Path $env:TIETIE_INSTALL_DIR 'Tietie.exe'))"
          Get-Content "$env:RUNNER_TEMP\probe-out.txt", "$env:RUNNER_TEMP\probe-err.txt" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
          Remove-Item env:TIETIE_INSTALL_DIR, env:TIETIE_NO_OPEN
          # 實驗 B：像一般使用者從開始功能表打開貼貼，用 Windows 預設的模組路徑
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          Write-Host "PSModulePath 改成 Windows 預設：$env:PSModulePath"
          $p = Start-Process $exe -ArgumentList '--no-onboarding' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms
          $root = [Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dlg = $null
          for ($i = 0; $i -lt 60 -and -not $dlg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -like '*貼貼*' -or $w.Current.Name -like '*Tietie*') { $dlg = $w } }
          }
          if (-not $dlg) { Write-Host 'FAIL  沒有跳出新版提示'; exit 1 }
          # 0.4.0 只有中文；之後的版本跟著系統語言，這台測試電腦是英文
          $nameCond = New-Object Windows.Automation.OrCondition(
            (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, '立即更新')),
            (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, 'Update Now')))
          $btn = $dlg.FindFirst([Windows.Automation.TreeScope]::Descendants, $nameCond)
          $names = ($dlg.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | '
          Write-Host "找到的視窗：$($dlg.Current.Name)　內容：$names"
          if (-not $btn) { Write-Host 'FAIL  提示裡找不到立即更新按鈕'; exit 1 }
          Write-Host "按下：$($btn.Current.Name)"
          $pat = $null
          if ($btn.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern, [ref]$pat)) { $pat.Invoke() }
          else { $btn.SetFocus(); Start-Sleep -Milliseconds 300; [System.Windows.Forms.SendKeys]::SendWait(' ') }
          $new = $null
          for ($i = 0; $i -lt 150 -and -not $new; $i++) {
            Start-Sleep 1
            $new = Get-Process -Name Tietie -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $p.Id } | Select-Object -First 1
          }
          $oldAlive = -not $p.HasExited
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Tietie|powershell' } | ForEach-Object { Write-Host "程序：$($_.ProcessId) $($_.Name) $($_.CommandLine)" }
          foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) {
            $t = ($w.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | '
            Write-Host "貼貼開著的視窗：$($w.Current.Name)　$t"
          }
          Get-Content (Join-Path $env:TIETIE_HOME 'error.log') -Encoding UTF8 -ErrorAction SilentlyContinue | Select-Object -First 30
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
          $bmp.Save("$env:RUNNER_TEMP\shots\after-update.png")
          $after = (Get-Item $exe).LastWriteTimeUtc
          Write-Host "舊的還在跑：$oldAlive　新的：$($new.Id)　檔案更新前 $before　更新後 $after"
          Get-Process -Name Tietie -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($oldAlive -or -not $new) { Write-Host 'FAIL  按了立即更新，沒有換成新版重新打開'; exit 1 }
          Write-Host 'PASS  按「立即更新」後，舊版關閉、新版下載安裝並自動打開'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-check-windows
          path: ${{ runner.temp }}/shots

  mac:
    runs-on: macos-latest
    steps:
      - name: 照教學貼那一行
        run: |
          TIETIE_INSTALL_DIR="$RUNNER_TEMP/apps" TIETIE_NO_OPEN=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/KLWSharpe/tietie/main/install.sh)"
          "$RUNNER_TEMP/apps/Tietie.app/Contents/MacOS/Tietie" --version
          TIETIE_HOME="$RUNNER_TEMP/tt" "$RUNNER_TEMP/apps/Tietie.app/Contents/MacOS/Tietie" --selftest | tail -3
