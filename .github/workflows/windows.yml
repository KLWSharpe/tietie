name: Windows

on:
  push:
    branches: [main, windows]
    paths:
      - 'windows/**'
      - 'install.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 組裝
        run: >
          dotnet publish windows/Tietie/Tietie.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o out

      - name: 版本
        shell: pwsh
        run: |
          $p = Start-Process out\Tietie.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\version.txt"
          Get-Content "$env:RUNNER_TEMP\version.txt"
          (Get-Item out\Tietie.exe).Length / 1MB

      - name: 自我檢查
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-self"
          $p = Start-Process out\Tietie.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\selftest.txt" -Encoding UTF8 -ErrorAction SilentlyContinue
          Get-Content "$env:TIETIE_HOME\error.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 版面截圖
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-ui"
          $p = Start-Process out\Tietie.exe -ArgumentList '--render-ui', "$env:RUNNER_TEMP\shots" -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\render.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 實際操作測試
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-e2e"
          $env:TIETIE_SHOTS = "$env:RUNNER_TEMP\shots"
          $p = Start-Process out\Tietie.exe -ArgumentList '--e2e' -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\e2e.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 新版提示測試
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-upd"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
          '{"tag_name":"v9.9.9"}' | Set-Content "$env:RUNNER_TEMP\fake-release.json" -Encoding UTF8
          $env:TIETIE_UPDATE_URL = ([Uri]"$env:RUNNER_TEMP\fake-release.json").AbsoluteUri
          $env:TIETIE_UPDATE_DRYRUN = '1'
          $p = Start-Process out\Tietie.exe -ArgumentList '--no-onboarding' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          $root = [Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dlg = $null
          for ($i = 0; $i -lt 60 -and -not $dlg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -eq '貼貼') { $dlg = $w } }
          }
          if (-not $dlg) { Write-Host 'FAIL  沒有跳出新版提示'; Stop-Process $p -Force; exit 1 }
          $text = ($dlg.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | '
          Write-Host "提示內容：$text"
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\shots\e2e_6_新版提示.png")
          if ($text -notmatch '9\.9\.9' -or $text -notmatch '立即更新') { Write-Host 'FAIL  提示內容不對'; Stop-Process $p -Force; exit 1 }
          $btn = $dlg.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, '立即更新')))
          $btn.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
          Start-Sleep 2
          $alive = -not $p.HasExited
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $alive) { Write-Host 'FAIL  按了立即更新之後貼貼當掉'; exit 1 }
          Write-Host 'PASS  新版提示跳出，按「立即更新」有反應'

      - name: 打包
        if: always()
        shell: pwsh
        run: Compress-Archive -Path out\Tietie.exe -DestinationPath Tietie-Windows.zip -Force

      - name: 測試安裝指令（Windows PowerShell 5.1，跟一般人的電腦一樣）
        shell: powershell
        run: |
          $env:TIETIE_ZIP_PATH = "$PWD\Tietie-Windows.zip"
          $env:TIETIE_INSTALL_DIR = "$env:RUNNER_TEMP\installed"
          $env:TIETIE_NO_OPEN = '1'
          Get-Content install.ps1 -Raw -Encoding UTF8 | Invoke-Expression
          if (-not (Test-Path "$env:RUNNER_TEMP\installed\Tietie.exe")) { exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\installed"
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter '*Tietie.lnk' | Select-Object -First 1
          Write-Host "Start menu shortcut: $($lnk.Name)"
          if (-not $lnk) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Tietie-Windows
          path: Tietie-Windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/tt-self/selftest.txt
            ${{ runner.temp }}/tt-ui/render.txt
            ${{ runner.temp }}/tt-e2e/e2e.txt
            ${{ runner.temp }}/tt-*/error.log
