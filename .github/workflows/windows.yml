name: Windows

on:
  push:
    branches: [main, windows]
    paths:
      - 'windows/**'
      - 'i18n/**'
      - 'install.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 組裝
        run: >
          dotnet publish windows/Tietie/Tietie.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o out

      - name: 版本
        shell: pwsh
        run: |
          $p = Start-Process out\Tietie.exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\version.txt"
          Get-Content "$env:RUNNER_TEMP\version.txt"
          (Get-Item out\Tietie.exe).Length / 1MB

      - name: 自我檢查
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-self"
          $p = Start-Process out\Tietie.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\selftest.txt" -Encoding UTF8 -ErrorAction SilentlyContinue
          Get-Content "$env:TIETIE_HOME\error.log" -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 版面截圖
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-ui"
          $p = Start-Process out\Tietie.exe -ArgumentList '--render-ui', "$env:RUNNER_TEMP\shots" -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\render.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 實際操作測試
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-e2e"
          $env:TIETIE_SHOTS = "$env:RUNNER_TEMP\shots"
          $p = Start-Process out\Tietie.exe -ArgumentList '--e2e' -Wait -PassThru
          Get-Content "$env:TIETIE_HOME\e2e.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 新版提示測試
        if: always()
        shell: pwsh
        run: |
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-upd"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
          '{"tag_name":"v9.9.9"}' | Set-Content "$env:RUNNER_TEMP\fake-release.json" -Encoding UTF8
          $env:TIETIE_UPDATE_URL = ([Uri]"$env:RUNNER_TEMP\fake-release.json").AbsoluteUri
          $env:TIETIE_UPDATE_DRYRUN = '1'
          $p = Start-Process out\Tietie.exe -ArgumentList '--no-onboarding' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          $root = [Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dlg = $null
          for ($i = 0; $i -lt 60 -and -not $dlg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -like '*Tietie*') { $dlg = $w } }
          }
          if (-not $dlg) { Write-Host 'FAIL  沒有跳出新版提示'; Stop-Process $p -Force; exit 1 }
          # 這台測試電腦是英文 Windows，貼貼要跟著系統語言用英文
          $text = ($dlg.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | '
          Write-Host "提示內容：$text"
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\shots\e2e_6_新版提示.png")
          if ($text -notmatch '9\.9\.9' -or $text -notmatch 'Update Now') { Write-Host 'FAIL  提示內容不對（應該跟著系統顯示英文）'; Stop-Process $p -Force; exit 1 }
          $btn = $dlg.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, 'Update Now')))
          $pat = $null
          if ($btn.TryGetCurrentPattern([Windows.Automation.InvokePattern]::Pattern, [ref]$pat)) { $pat.Invoke() }
          else { $btn.SetFocus(); Start-Sleep -Milliseconds 300; [System.Windows.Forms.SendKeys]::SendWait(' ') }
          Start-Sleep 1
          $still = $root.FindAll([Windows.Automation.TreeScope]::Children, $cond) | Where-Object { $_.Current.Name -like '*Tietie*' }
          if ($still) { Write-Host 'FAIL  按了立即更新，提示沒有關掉'; Stop-Process $p -Force; exit 1 }
          Start-Sleep 2
          $alive = -not $p.HasExited
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $alive) { Write-Host 'FAIL  按了立即更新之後貼貼當掉'; exit 1 }
          Write-Host 'PASS  新版提示跳出（跟著系統用英文），按「Update Now」有反應'

      - name: 打包
        if: always()
        shell: pwsh
        run: Compress-Archive -Path out\Tietie.exe -DestinationPath Tietie-Windows.zip -Force

      - name: 從貼貼裡按立即更新（從 PowerShell 7 打開，裝這次組好的 zip）
        shell: pwsh
        run: |
          # 0.5.0 在這個情況會默默失敗：貼貼帶著 PowerShell 7 的模組路徑呼叫 Windows PowerShell 5.1，解壓縮失敗
          Get-Process -Name Tietie -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path $env:RUNNER_TEMP 'upd-app'
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item out\Tietie.exe $app -Force
          $exe = Join-Path $app 'Tietie.exe'
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-real-upd"
          '{"tag_name":"v9.9.9"}' | Set-Content "$env:RUNNER_TEMP\fake-release.json" -Encoding UTF8
          $env:TIETIE_UPDATE_URL = ([Uri]"$env:RUNNER_TEMP\fake-release.json").AbsoluteUri
          $env:TIETIE_ZIP_PATH = "$PWD\Tietie-Windows.zip"
          Write-Host "PSModulePath：$env:PSModulePath"
          $p = Start-Process $exe -ArgumentList '--no-onboarding' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          $root = [Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dlg = $null
          for ($i = 0; $i -lt 60 -and -not $dlg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -like '*Tietie*') { $dlg = $w } }
          }
          if (-not $dlg) { Write-Host 'FAIL  沒有跳出新版提示'; Stop-Process $p -Force; exit 1 }
          $btn = $dlg.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, 'Update Now')))
          $btn.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
          $new = $null
          for ($i = 0; $i -lt 90 -and -not $new; $i++) {
            Start-Sleep 1
            $new = Get-Process -Name Tietie -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $p.Id -and $_.Path -eq $exe } | Select-Object -First 1
          }
          $oldAlive = -not $p.HasExited
          Write-Host "舊的還在跑：$oldAlive　新的：$($new.Id)"
          Get-Content "$env:TIETIE_HOME\update.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          Get-Process -Name Tietie -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($oldAlive -or -not $new) { Write-Host 'FAIL  從 PowerShell 7 打開的貼貼按立即更新，沒有換成新版'; exit 1 }
          Write-Host 'PASS  從 PowerShell 7 打開的貼貼按立即更新：舊版關閉、新版裝好並自動打開'

      - name: 更新失敗時要告訴使用者
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name Tietie -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $env:RUNNER_TEMP 'upd-app\Tietie.exe'
          if (-not (Test-Path $exe)) { New-Item -ItemType Directory -Force -Path (Split-Path $exe) | Out-Null; Copy-Item out\Tietie.exe $exe }
          $env:TIETIE_HOME = "$env:RUNNER_TEMP\tt-fail-upd"
          '{"tag_name":"v9.9.9"}' | Set-Content "$env:RUNNER_TEMP\fake-release.json" -Encoding UTF8
          $env:TIETIE_UPDATE_URL = ([Uri]"$env:RUNNER_TEMP\fake-release.json").AbsoluteUri
          $env:TIETIE_ZIP_PATH = "$env:RUNNER_TEMP\no-such-file.zip"
          $p = Start-Process $exe -ArgumentList '--no-onboarding' -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          $root = [Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $dlg = $null
          for ($i = 0; $i -lt 60 -and -not $dlg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -like '*Tietie*') { $dlg = $w } }
          }
          if (-not $dlg) { Write-Host 'FAIL  沒有跳出新版提示'; Stop-Process $p -Force; exit 1 }
          $btn = $dlg.FindFirst([Windows.Automation.TreeScope]::Descendants, (New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, 'Update Now')))
          $btn.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
          $msg = $null
          for ($i = 0; $i -lt 60 -and -not $msg; $i++) {
            Start-Sleep 1
            foreach ($w in $root.FindAll([Windows.Automation.TreeScope]::Children, $cond)) { if ($w.Current.Name -eq "Couldn't update automatically") { $msg = $w } }
          }
          $text = if ($msg) { ($msg.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.Condition]::TrueCondition) | ForEach-Object { $_.Current.Name } | Where-Object { $_ }) -join ' | ' } else { '' }
          Write-Host "提示內容：$text"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\shots\e2e_10_更新失敗提示.png")
          Get-Content "$env:TIETIE_HOME\update.log" -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Host "  $_" }
          $alive = -not $p.HasExited
          Get-Process -Name Tietie -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $msg -or $text -notmatch 'install\.ps1' -or -not $alive) { Write-Host 'FAIL  更新失敗時沒有跳出提示'; exit 1 }
          Write-Host 'PASS  更新失敗時跳出「Couldn''t update automatically」並附上手動安裝指令'

      - name: 測試安裝指令（Windows PowerShell 5.1，跟一般人的電腦一樣）
        shell: powershell
        run: |
          $env:TIETIE_ZIP_PATH = "$PWD\Tietie-Windows.zip"
          $env:TIETIE_INSTALL_DIR = "$env:RUNNER_TEMP\installed"
          $env:TIETIE_NO_OPEN = '1'
          Get-Content install.ps1 -Raw -Encoding UTF8 | Invoke-Expression
          if (-not (Test-Path "$env:RUNNER_TEMP\installed\Tietie.exe")) { exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP\installed"
          $lnk = Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter '*Tietie.lnk' | Select-Object -First 1
          Write-Host "Start menu shortcut: $($lnk.Name)"
          if (-not $lnk) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Tietie-Windows
          path: Tietie-Windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/tt-self/selftest.txt
            ${{ runner.temp }}/tt-ui/render.txt
            ${{ runner.temp }}/tt-e2e/e2e.txt
            ${{ runner.temp }}/tt-*/error.log
